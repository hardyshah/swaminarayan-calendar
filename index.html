<title>Shree Swaminarayan Calendar</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: the night sky of Akshardham. A journey ribbon on top, the month of moons on the left, the open day on the right. */
:root {
  color-scheme: dark;
  --night: #0f0e2a; --panel: #1a1840; --panel2: #24215a; --rule: #3a3672;
  --gold: #e9c46f; --saffron: #f4a24f; --ivory: #f8f0e0; --soft: #bcb5d6; --kumkum: #ef6a5e;
  --f-guj: "Rasa", "Noto Serif Gujarati", "Shruti", serif;
  --f-body: "Gentium Book Plus", Georgia, serif;
  --f-ui: "Martel Sans", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box }
body { background: var(--night) radial-gradient(1100px 520px at 50% -140px, #3b2a78 0%, rgba(59,42,120,0) 70%) no-repeat; color: var(--ivory); font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 56px }
button, select, input, textarea { font: inherit; color: inherit }
a { color: var(--gold) }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px }
.en { font-family: var(--f-ui); font-size: 12.5px; color: var(--soft) }
.btn, select, input[type=search], input[type=text], textarea { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 11px; min-height: 36px }
.btn { cursor: pointer; font-family: var(--f-ui); font-size: 14px } .btn:hover { border-color: var(--gold) } .btn[disabled] { opacity: .4; cursor: default }
.btn[aria-pressed=true] { background: var(--panel2); border-color: var(--gold); color: var(--gold) }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #24174a; font-weight: 800 }
.btn.gold:hover { background: #f4d68c }
.langbar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-family: var(--f-ui); font-size: 14px }
.langbar label { font-weight: 600; color: var(--gold) }
.langbar select { min-width: 0; max-width: 100% }
#tstat { color: var(--soft); font-size: 13px; min-width: 0 }
#reviewbtn { margin-left: auto }
.hero { text-align: center; display: grid; gap: 4px; padding-block: 10px 2px }
.hero .jay { font-family: var(--f-guj); font-weight: 600; font-size: 17px; color: var(--saffron) }
.hero h1 { margin: 0; font-family: var(--f-guj); font-weight: 700; color: var(--gold); font-size: clamp(36px, 6.5vw, 64px); line-height: 1.1; text-wrap: balance }
.journey { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative }
.journey::before { content: ""; position: absolute; left: 10%; right: 10%; top: 13px; height: 2px; background: linear-gradient(90deg, var(--gold), var(--saffron), var(--rule)) }
.stage { position: relative; background: none; border: 0; cursor: pointer; display: grid; justify-items: center; gap: 2px; padding: 0 6px; text-align: center; min-width: 0 }
.stage i { width: 28px; height: 28px; border-radius: 50%; background: var(--night); border: 2px solid var(--gold) }
.stage.now i { background: var(--gold); box-shadow: 0 0 16px var(--gold) }
.stage b { font-family: var(--f-guj); font-weight: 700; font-size: 18px; line-height: 1.2 }
.stage span { font-family: var(--f-ui); font-size: 11.5px; color: var(--soft) }
.stage[disabled] { cursor: default; opacity: .55 }
.onday { background: linear-gradient(100deg, var(--panel2), var(--panel)); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0 }
.onday h2 { margin: 0; font-family: var(--f-guj); font-size: 22px; color: var(--gold); line-height: 1.2 }
.onday .row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px }
.card { flex: 0 0 min(250px, 78vw); background: var(--night); border: 1px solid var(--rule); border-radius: 10px; text-align: left; padding: 9px 11px; cursor: pointer; display: grid; gap: 2px }
.card:hover { border-color: var(--gold) }
.card b { font-family: var(--f-guj); font-size: 17px; color: var(--gold); line-height: 1.2 }
.card p { margin: 0; font-size: 14.5px; line-height: 1.3 }
.main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start }
.side { display: grid; gap: 14px; position: sticky; top: calc(10px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 20px); overflow-y: auto; min-width: 0 }
.monthhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; justify-content: space-between; margin-bottom: 10px }
.title { font-family: var(--f-guj); font-weight: 700; font-size: clamp(27px, 4vw, 38px); line-height: 1.1; color: var(--gold) }
.samvat { font-family: var(--f-guj); font-weight: 600; font-size: 20px }
.ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--f-ui); font-size: 14px }
input[type=search] { min-width: 0; width: 12em; max-width: 100% }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px }
.wd { padding: 2px 4px; text-align: center; font-family: var(--f-guj); font-weight: 600; font-size: 15px; color: var(--gold); line-height: 1.2 }
.wd small { display: block; font-family: var(--f-ui); font-size: 10px; font-weight: 400; color: var(--soft) }
.cell { background: var(--panel); border: 1px solid transparent; border-radius: 9px; text-align: left; padding: 6px 7px; min-height: 112px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; position: relative }
.cell.blank { background: none; cursor: default }
.cell:hover:not(.blank) { background: var(--panel2) }
.cell.lila { background: #262052 }
.cell.sel { border-color: var(--gold); box-shadow: 0 0 14px rgba(233,196,111,.35) }
.cell.hide { opacity: .25 }
.cell .tt { font-family: var(--f-guj); font-weight: 700; font-size: 19px; line-height: 1.1; color: var(--gold); padding-right: 16px }
.cell .moon { position: absolute; top: 7px; right: 7px; width: 14px; height: 14px }
.cell .tm { font-family: var(--f-guj); font-weight: 600; font-size: 13px; line-height: 1.15 }
.cell .gd { font-family: var(--f-ui); font-size: 10.5px; color: var(--soft) }
.cell .ev { font-size: 12.5px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical }
.cell .ev.rt { color: var(--soft) }
.cell .mem { font-family: var(--f-ui); font-size: 10.5px; font-weight: 800; color: var(--saffron) }
.day, .box { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; display: grid; gap: 6px; min-width: 0 }
.day .big { font-family: var(--f-guj); font-weight: 700; font-size: clamp(30px, 4.2vw, 42px); line-height: 1.1; color: var(--gold) }
.day .sub { font-family: var(--f-guj); font-weight: 600; font-size: 21px; line-height: 1.25 }
.day img.pic { width: 100%; max-height: 300px; object-fit: contain; background: var(--night); border-radius: 10px; margin-top: 8px }
.day ul { margin: 8px 0 0; padding-left: 1.1em; font-size: 18px }
.note { font-family: var(--f-ui); font-size: 12.5px; color: var(--soft); margin: 0 }
.warn { background: var(--panel2); border: 1px dashed var(--saffron); border-radius: 10px; padding: 12px 14px; font-family: var(--f-ui); font-size: 14px; margin-bottom: 10px }
.memories { margin-top: 10px; display: grid; gap: 6px }
.memories h3 { margin: 0; font-family: var(--f-ui); font-size: 13px; color: var(--saffron) }
.memories details { background: var(--night); border-radius: 8px; padding: 7px 10px }
.memories summary { cursor: pointer }
.memories img, .rev img { max-width: 100%; max-height: 260px; border-radius: 8px; display: block; margin-top: 6px }
.memories p { margin: 6px 0 0; font-size: 15.5px; white-space: pre-wrap }
.box form { display: grid; gap: 9px }
.box h3 { margin: 0; font-family: var(--f-guj); font-size: 21px; color: var(--gold) }
.field { display: grid; gap: 3px; font-family: var(--f-ui); font-size: 13px; min-width: 0 }
.field input, .field textarea, .field select { width: 100%; font-family: var(--f-body); font-size: 16px }
.field small { color: var(--soft); font-size: 11.5px }
textarea { min-height: 96px; resize: vertical }
.rev { background: var(--night); border: 1px solid var(--rule); border-radius: 10px; padding: 11px; display: grid; gap: 7px }
.rev .acts { display: flex; flex-wrap: wrap; gap: 6px }
.hits { display: grid; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; max-height: 340px; overflow-y: auto; margin-bottom: 10px }
.hit { background: none; border: 0; border-bottom: 1px solid var(--rule); text-align: left; padding: 8px 12px; cursor: pointer }
.hit:hover { background: var(--panel2) }
.hit b { font-family: var(--f-guj); font-size: 17px; display: block; line-height: 1.2; color: var(--gold) }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr) } .side { position: static; max-height: none; overflow: visible } }
@media (max-width: 680px) {
  .stage b { font-size: 13.5px } .stage span { font-size: 10px }
  .grid { grid-template-columns: minmax(0, 1fr) } .wd, .cell.blank { display: none }
  .cell { min-height: 0; display: grid; grid-template-columns: 5.6em minmax(0, 1fr); column-gap: 10px }
  .cell .tt { grid-row: 1; grid-column: 1 } .cell .tm { grid-row: 2; grid-column: 1 } .cell .gd { grid-row: 3; grid-column: 1 }
  .cell .ev { grid-row: 1 / span 3; grid-column: 2; font-size: 15px; -webkit-line-clamp: 4 }
  .cell .mem { grid-column: 2 }
}
</style>

<div class="wrap">
  <div class="langbar" hidden>
    <label for="lang">Language / ભાષા</label>

    <span id="tstat" role="status"></span>

    <button class="btn gold" id="reviewbtn" type="button" hidden>Review</button>
  </div>
  <header class="hero">

    <h1>શ્રી હરિ દિનચર્યા</h1>

  </header>
  <nav class="journey" id="journey" aria-label="Stages of his life"></nav>
  <section class="onday" id="onday" hidden></section>
  <section class="box" id="review" hidden></section>
  <div class="main">
    <div>
      <div class="monthhead">
        <div><div class="title" id="mt"></div><div class="samvat" id="ms"></div><div class="en" id="me"></div></div>
        <div class="ctl" role="navigation" aria-label="Calendar navigation">
          <button class="btn" id="prev" type="button" aria-label="Previous month">&larr;</button>
          <select id="yr" aria-label="Year"></select>
          <select id="mo" aria-label="Month"></select>
          <button class="btn" id="next" type="button" aria-label="Next month">&rarr;</button>
          <button class="btn" id="only" type="button" aria-pressed="false">Lilas only</button>
          <input type="search" id="q" placeholder="Search events" aria-label="Search events">
        </div>
      </div>
      <div class="hits" id="hits" hidden></div>
      <div id="gap" class="warn" hidden></div>
      <div class="grid" id="grid"></div>
    </div>
    <aside class="side">
      <section class="day" id="day" aria-live="polite"></section>
      <section class="box" hidden>
        <button class="btn gold" id="addbtn" type="button">Add a memory for this day</button>
        <p class="note" id="addnote">Know a place or home he visited on this day? Share it. Everything is checked before it appears.</p>
        <form id="form" hidden>
          <h3 id="formday"></h3>
          <label class="field">What are you adding?
            <select id="f-kind"><option value="memory">A new event or memory</option><option value="correction">A correction to this day</option></select></label>
          <label class="field">One line for the calendar (required)
            <input type="text" id="f-line" maxlength="120" required><small>Up to 120 characters. Only this line shows on the calendar.</small></label>
          <label class="field">Place or home
            <input type="text" id="f-place" maxlength="120"></label>
          <label class="field">Full description
            <textarea id="f-detail" maxlength="3000"></textarea><small>Include your source if you have one, such as a book or family record.</small></label>
          <label class="field">Photo
            <input type="file" id="f-photo" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG or WebP, up to 8 MB.</small></label>
          <label class="field">Your name, to show with this entry
            <input type="text" id="f-credit" maxlength="80"></label>
          <div class="ctl"><button class="btn gold" type="submit" id="f-send">Send for review</button><button class="btn" type="button" id="f-cancel">Cancel</button></div>
          <p class="note" id="f-msg" role="status"></p>
        </form>
        <div id="mine"></div>
      </section>
    </aside>
  </div>
  <p class="note" id="foot"></p>
</div>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const special = n === '30' || (n === '15' && p === 's');
  const num = n === '30' ? 'અમાસ' : n === '15' && p === 's' ? 'પૂનમ' : gn(n.replace('+', '-'));
  const pk = p === 's' ? 'સુદ' : 'વદ';
  return {m: gMon(m), short: special ? num : pk + ' ' + num, full: gMon(m) + ' ' + pk + ' ' + num} }
function moon(t) { const [, p, n0] = t.split('|'), n = parseInt(n0, 10);
  const k = n === 30 ? 0 : p === 's' ? Math.min(n, 15) / 15 : 1 - Math.min(n, 15) / 15, rx = Math.abs(1 - 2 * k) * 7;
  const lit = k <= 0.02 ? '' : k >= 0.98 ? '<circle r="7" fill="#f8f0e0"/>' : `<path d="M0 -7A7 7 0 0 1 0 7A${rx.toFixed(2)} 7 0 0 ${k > .5 ? 1 : 0} 0 -7Z" fill="#f8f0e0" transform="scale(${p === 's' ? 1 : -1} 1)"/>`;
  return `<svg class="moon" viewBox="-8 -8 16 16" aria-hidden="true"><circle r="7" fill="#0f0e2a" stroke="#3a3672"/>${lit}</svg>` }

const LANGS = [['en','English'],['gu','ગુજરાતી (Gujarati)'],['hi','हिन्दी (Hindi)'],['mr','मराठी (Marathi)'],['bn','বাংলা (Bengali)'],['ta','தமிழ் (Tamil)'],['te','తెలుగు (Telugu)'],['es','Español (Spanish)'],['fr','Français (French)'],['de','Deutsch (German)']];

function saveLang() { try { localStorage.setItem('cal-tr-' + lang, JSON.stringify(T)) } catch (e) {} }
function status(msg, retry) { el('tstat').textContent = msg; el('retry').hidden = !retry }
async function translateMonth() {
  if (lang === 'en') { status('', false); return }
  const m = byYm.get(cur), list = [...UI];
  if (m) for (const v of Object.values(m.e)) for (const x of v) if (!list.includes(x)) list.push(x);
  const need = list.filter(x => !(x in T)), k = lang + cur;
  if (!need.length) { status('', false); return }
  if (tried.has(k)) return;
  tried.add(k);
  const my = ++seq, forLang = lang;
  status('Translating this month…', false);
  const sample = await sampleP;
  if (my !== seq) return;
  if (!sample) { status('Translation works only when this page is opened in Claude. Showing English.', false); return }
  const prompt = 'Translate each English line about the life of Bhagwan Shri Swaminarayan into ' + langName() + '. Use respectful devotional wording. Use the established ' + langName() + ' forms of names and terms such as Ghanshyam, Nilkanth Varni, Dharmadev, Bhaktimata, Chhapaiya, Ayodhya, samvat, lila, darshan, tapas. Translate only; add nothing. Reply with only a JSON array of strings, the same length and order as the input.\n\n' + JSON.stringify(need);
  try {
    const out = await sample.json(prompt, {modelTier: 'quick'});
    if (forLang !== lang) return;
    if (!Array.isArray(out) || out.length !== need.length) throw {code: 'invalid_json'};
    need.forEach((x, i) => { if (typeof out[i] === 'string' && out[i].trim()) T[x] = out[i] });
    saveLang();
    if (my === seq) status('', false);
    render();
  } catch (e) {
    if (my !== seq || e.code === 'cancelled') return;
    const off = ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code);
    if (off) status('Translation is not allowed for this page, so it is showing English.', false);
    else if (e.code === 'rate_limited') status('Too many translations just now. Wait a minute, then try again.', true);
    else if (e.code === 'session_expired') status('Please sign in to Claude again, then try again.', true);
    else status('This month could not be translated.', true);
  }
}

  try {
    if (b.dataset.act === 'approve') {
      await db.doc('approved/' + item.id).set({date: item.date, kind: item.kind, line: card.querySelector('.r-line').value.trim() || item.line, detail: card.querySelector('.r-detail').value.trim(), place: item.place || '', credit: item.credit || '', photo: item.photo || ''});
      await setStatus(item, 'approved');
    } else {
      await setStatus(item, 'rejected');
      if (item.photo && assets) assets.delete(item.photo).catch(() => {});
    }
  } catch (x) { b.disabled = false; cardNote(card, 'That did not save. Please try again.') }
});
el('reviewbtn').onclick = () => { reviewOpen = !reviewOpen; renderReview(); if (reviewOpen) el('review').scrollIntoView({block: 'nearest'}) };
el('addbtn').onclick = () => {
  const f = el('form');
  if (!db || !uid) { el('addnote').textContent = 'To add a memory, open this page in Claude while signed in, with contributor access from the owner.'; return }
  f.hidden = !f.hidden; el('f-msg').textContent = ''; formDay();
};
el('f-cancel').onclick = () => { el('form').hidden = true };
function formDay() { const m = byYm.get(cur); if (m) el('formday').textContent = tith(m.t.at(sel - 1)).full + ', સંવત ' + gn(m.vs) }
el('form').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = el('f-msg'), send = el('f-send'), file = el('f-photo').files[0], line = el('f-line').value.trim();
  if (!line) { msg.textContent = 'Please write the one line for the calendar.'; return }
  if (file && file.size > 8 * 1024 * 1024) { msg.textContent = 'That photo is over 8 MB. Please choose a smaller one.'; return }
  if (file && !assets) { msg.textContent = 'Your access does not allow photo uploads. Remove the photo to send the rest.'; return }
  send.disabled = true; msg.textContent = 'Sending…';
  try {
    const photo = file ? (await assets.upload(file)).id : '';
    const item = {id: crypto.randomUUID().replace(/-/g, ''), date: dateKey(cur, sel), kind: el('f-kind').value, line, place: el('f-place').value.trim(), detail: el('f-detail').value.trim(), credit: el('f-credit').value.trim(), photo, status: 'pending', at: new Date().toISOString()};
    const ref = db.doc('submissions/' + uid), s = await ref.get();
    await ref.set({items: [...(s.data()?.items || []), item]});
    el('form').reset(); el('form').hidden = true;
    el('addnote').textContent = 'Thank you. Your entry was sent for review and will appear once it is approved.';
  } catch (x) {
    msg.textContent = x?.code === 'quota_or_state' || x?.code === 'quota_exceeded' ? 'Storage for this page is full. Please tell the owner.' : x?.code === 'too_large' ? 'That photo is too large.' : 'This could not be sent. Your access may not allow adding entries; ask the owner for contributor access.';
  } finally { send.disabled = false }
});

// Calendar
function fill() {
  const y0 = Number(first.slice(0, 4)), y1 = Number(last.slice(0, 4));
  el('yr').innerHTML = Array.from({length: y1 - y0 + 1}, (_, i) => `<option value="${y0 + i}">સં. ${gn(y0 + i + 56)}–${gn(y0 + i + 57)} (${y0 + i})</option>`).join('');
  el('mo').innerHTML = EN.map((n, i) => `<option value="${i + 1}">${n}</option>`).join('');
}
const isLila = (m, d) => (m.e[d] || []).some(x => !R.has(x));
function picFor(m, d) {
  const want = 0.18 + 0.74 * d / m.t.length;
  for (let i = D.months.indexOf(m); i >= 0; i--) { const a = D.art[D.months[i].pg];
    if (a && a.length) return a.reduce((b, c) => Math.abs(c[1] - want) < Math.abs(b[1] - want) ? c : b)[0] }
  return '';
}
function renderJourney() {
  const ci = idx(cur);
  el('journey').innerHTML = STAGES.map(([g, e, ym], i) => { const here = ci >= idx(ym) && (i === 4 || ci < idx(STAGES[i + 1][2])), off = idx(ym) > idx(last);
    return `<button type="button" class="stage${here ? ' now' : ''}" data-ym="${ym}"${off ? ' disabled' : ''}><i></i><b>${g}</b><span>${off ? e + ', coming soon' : e}</span></button>` }).join('');
}
function renderOnDay() {
  const now = new Date(), mm = now.getMonth() + 1, dd = now.getDate(), hits = [];
  for (const m of D.months) { if (Number(m.ym.slice(5)) !== mm || !m.t[dd - 1]) continue;
    const ev = (m.e[dd] || []).find(x => !R.has(x)); if (ev) hits.push([m, ev]) }
  el('onday').hidden = !hits.length;
  if (hits.length) el('onday').innerHTML = `<h2>આજના દિવસે</h2><div class="en">On ${dd} ${EN.at(mm - 1)} in his life</div><div class="row">` + hits.map(([m, ev]) =>
    `<button type="button" class="card" data-ym="${m.ym}" data-d="${dd}"><b>${tith(m.t.at(dd - 1)).full}, સં. ${gn(m.vs)}</b><span class="en">${m.ym.slice(0, 4)}</span><p>${esc(tr(ev))}</p></button>`).join('') + '</div>';
}
function render() {
  document.documentElement.lang = lang;
  el('only').textContent = tr('Lilas only'); el('q').placeholder = tr('Search events'); el('addbtn').textContent = tr('Add a memory for this day');
  const [y, mo] = cur.split('-').map(Number), m = byYm.get(cur);
  el('yr').value = String(y); el('mo').value = String(mo);
  el('prev').disabled = cur === first; el('next').disabled = cur === last;
  const n = new Date(Date.UTC(y, mo, 0)).getUTCDate(), start = new Date(Date.UTC(y, mo - 1, 1)).getUTCDay();
  if (m) { el('mt').textContent = [...new Set(m.t.map(t => tith(t).m))].join(' – '); el('ms').textContent = 'વિક્રમ સંવત ' + gn(m.vs) }
  else { el('mt').textContent = 'આ મહિનો ઉપલબ્ધ નથી'; el('ms').textContent = '' }
  el('me').textContent = EN.at(mo - 1) + ' ' + y + (m ? ' · Calendar PDF page ' + m.pg : '');
  el('gap').hidden = !!m;
  if (!m) el('gap').textContent = EN.at(mo - 1) + ' ' + y + ' is not in the calendar PDF. Its printed page numbers jump from 15 to 18, so this month was not scanned.';
  let h = GW2.map((g, i) => `<div class="wd">${g}<small>${WK.at(i).slice(0, 3)}</small></div>`).join('');
  for (let i = 0; i < start; i++) h += '<div class="cell blank"></div>';
  for (let d = 1; d <= n; d++) {
    if (!m) { h += `<div class="cell blank"><span class="gd">${d}</span></div>`; continue }
    const t = tith(m.t.at(d - 1)), ev = m.e[d] || [], mem = approved.get(dateKey(cur, d)) || [], l = isLila(m, d) || mem.length > 0;
    const top = ev.find(x => !R.has(x)) || ev[0] || (mem[0] ? mem[0].line : '');
    h += `<button type="button" class="cell${l ? ' lila' : ''}${d === sel ? ' sel' : ''}${only && !l ? ' hide' : ''}" data-d="${d}">${moon(m.t.at(d - 1))}<span class="tt">${t.short}</span><span class="tm">${t.m}</span><span class="gd">${d} ${EN.at(mo - 1).slice(0, 3)}</span><span class="ev${l ? '' : ' rt'}">${esc(tr(top))}</span>${mem.length ? `<span class="mem">+${mem.length} ${mem.length === 1 ? 'memory' : 'memories'}</span>` : ''}</button>`;
  }
  el('grid').innerHTML = h;
  renderDay(); renderJourney(); renderOnDay(); translateMonth();
  try { history.replaceState(null, '', '#d' + cur.replace('-', '') + String(sel).padStart(2, '0')) } catch (e) {}
}
function renderDay() {
  const [y, mo] = cur.split('-').map(Number), m = byYm.get(cur);
  if (!m) { el('day').hidden = true; return } el('day').hidden = false;
  if (sel > m.t.length) sel = m.t.length;
  const t = tith(m.t.at(sel - 1)), w = new Date(Date.UTC(y, mo - 1, sel)).getUTCDay(), ev = m.e[sel] || [], pic = picFor(m, sel), mem = approved.get(dateKey(cur, sel)) || [];
  el('day').innerHTML = `<div class="big">${t.full}</div><div class="sub">સંવત ${gn(m.vs)}, ${GWK.at(w)}</div>
  <div class="en">${WK.at(w)}, ${sel} ${EN.at(mo - 1)} ${y} · Day ${dayNo(y, mo, sel).toLocaleString('en-IN')} · Age ${ageOf(y, mo, sel)}</div>
  ${pic ? `<img class="pic" src="art/${esc(pic)}" alt="Calendar illustration from this part of the month" onerror="this.hidden=true">` : ''}
  ${ev.length ? `<ul>${ev.map(x => `<li>${esc(tr(x))}</li>`).join('')}</ul>` : `<p class="note">${esc(tr('The calendar leaves this day blank.'))}</p>`}
  ${mem.length ? `<div class="memories"><h3>Memories from devotees, approved</h3>${mem.map(a => { const u = photoUrl(a.photo);
    return `<details><summary>${a.kind === 'correction' ? 'Correction: ' : ''}${esc(a.line)}</summary>${a.place ? `<div class="en">${esc(a.place)}</div>` : ''}${a.detail ? `<p>${esc(a.detail)}</p>` : ''}${u ? `<img src="${u}" alt="Photo added with this memory">` : ''}${a.credit ? `<div class="en">Shared by ${esc(a.credit)}</div>` : ''}${isOwner ? `<button class="btn" type="button" data-rm="${esc(a.id)}">Remove</button>` : ''}</details>` }).join('')}</div>` : ''}`;
  if (!el('form').hidden) formDay();
}
el('day').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b && isOwner) { b.disabled = true; db.doc('approved/' + b.dataset.rm).delete().catch(() => { b.disabled = false }) } });
function go(ym, d) { cur = fromIdx(Math.min(idx(last), Math.max(idx(first), idx(ym)))); if (d) sel = d; render() }
el('prev').onclick = () => go(fromIdx(idx(cur) - 1));
el('next').onclick = () => go(fromIdx(idx(cur) + 1));
el('yr').onchange = e => go(key(e.target.value, el('mo').value));
el('mo').onchange = e => go(key(el('yr').value, e.target.value));
el('only').onclick = e => { only = !only; e.currentTarget.setAttribute('aria-pressed', String(only)); render() };
el('grid').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) { sel = Number(b.dataset.d); render() } });
el('journey').addEventListener('click', e => { const b = e.target.closest('[data-ym]'); if (b && !b.disabled) go(b.dataset.ym, 1) });
el('onday').addEventListener('click', e => { const b = e.target.closest('[data-ym]'); if (b) go(b.dataset.ym, Number(b.dataset.d)) });
el('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(), box = el('hits');
  if (q.length < 2) { box.hidden = true; box.innerHTML = ''; return }
  const out = [];
  for (const m of D.months) for (const d of Object.keys(m.e)) for (const x of m.e[d]) if (!R.has(x) && x.toLowerCase().includes(q)) out.push([m, Number(d), x]);
  box.hidden = false;
  box.innerHTML = out.length ? out.slice(0, 40).map(([m, d, x]) => { const [y, mo] = m.ym.split('-').map(Number);
    return `<button type="button" class="hit" data-ym="${m.ym}" data-d="${d}"><b>${tith(m.t.at(d - 1)).full}, સંવત ${gn(m.vs)}</b><span class="en">${d} ${EN.at(mo - 1)} ${y}</span><br>${esc(tr(x))}</button>` }).join('') + (out.length > 40 ? `<p class="note" style="padding:8px 12px">Showing 40 of ${out.length}.</p>` : '')
    : `<p class="note" style="padding:8px 12px">${esc(tr('No events match that search.'))}</p>`;
});
el('hits').addEventListener('click', e => { const b = e.target.closest('[data-ym]'); if (b) go(b.dataset.ym, Number(b.dataset.d)) });
document.addEventListener('keydown', e => { if (e.target.matches('input, select, textarea')) return;
  if (e.key === 'ArrowRight') el('next').click(); if (e.key === 'ArrowLeft') el('prev').click() });
const lilas = D.months.reduce((a, m) => a + Object.keys(m.e).filter(d => isLila(m, d)).length, 0);
const [fy, fm] = first.split('-').map(Number), [ly, lm] = last.split('-').map(Number);
el('foot').textContent = `Covers ${EN.at(fm - 1)} ${fy} to ${EN.at(lm - 1)} ${ly}: ${D.months.length} months, ${lilas} days with a recorded lila. ${D.more} Events are short English summaries of the Gujarati entries in the Shree Swaminarayan Calendar Catalogue. The calendar gives no times of day. The moon beside each tithi is drawn from the tithi, not from astronomy. This is an independent devotional project, not an official publication of any sanstha.`;
el('lang').innerHTML = LANGS.map(([c, n]) => `<option value="${c}">${n}</option>`).join('');
try { const s = localStorage.getItem('cal-lang'); if (LANGS.some(l => l[0] === s)) lang = s } catch (e) {}
el('lang').value = lang; loadLang();
el('lang').onchange = e => { seq++; lang = e.target.value; try { localStorage.setItem('cal-lang', lang) } catch (x) {} loadLang(); tried.clear(); status('', false); render() };
el('retry').onclick = () => { tried.delete(lang + cur); render() };
fill();
function fromHash() { const h = location.hash.match(/^#d(\d{4})(\d{2})(\d{2})$/); if (h) { cur = h[1] + '-' + h[2]; sel = Number(h[3]) } }
fromHash(); render(); boot();
window.addEventListener('hashchange', () => { const before = cur + sel; fromHash(); if (before !== cur + sel) render() });
</script>
</body></html>
